name: Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'Deploy target'
        required: true
        default: 'azure-vm'
        type: choice
        options: [azure-vm, docker]

permissions:
  contents: read
  packages: write

jobs:
  build:
    # Skip cleanly when the consumer hasn't configured a deploy target yet —
    # avoids red ❌ checks on merges in freshly-installed repos that haven't
    # set up the deploy VM or registry credentials.
    if: vars.DEPLOY_TARGET != ''
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Compute image tag
        id: meta
        run: |
          IMAGE="${{ secrets.DOCKER_REGISTRY }}/app"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-azure-vm:
    needs: build
    if: ${{ github.event_name == 'push' || github.event.inputs.deploy_target == 'azure-vm' }}
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy to Azure VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_SSH_KEY }}
          envs: GITHUB_SHA
          script: |
            set -e
            cd ~/app
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login ${{ secrets.DOCKER_REGISTRY }} -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
            export IMAGE="${{ secrets.DOCKER_REGISTRY }}/app:${{ github.sha }}"
            echo "IMAGE=$IMAGE" > .env
            echo "APP_PORT=${{ vars.APP_PORT }}" >> .env
            docker compose pull
            docker compose down || true
            docker compose up -d
            sleep 5
            curl -fsS "http://localhost:${{ vars.APP_PORT }}/health" || (docker compose logs --tail=100 && exit 1)
            docker image prune -f

  deploy-docker:
    needs: build
    if: ${{ github.event.inputs.deploy_target == 'docker' }}
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy to Docker host
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_SSH_KEY }}
          script: |
            set -e
            cd ~/app
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login ${{ secrets.DOCKER_REGISTRY }} -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
            export IMAGE="${{ secrets.DOCKER_REGISTRY }}/app:${{ github.sha }}"
            echo "IMAGE=$IMAGE" > .env
            echo "APP_PORT=${{ vars.APP_PORT }}" >> .env
            docker compose pull
            docker compose down || true
            docker compose up -d
            sleep 5
            curl -fsS "http://localhost:${{ vars.APP_PORT }}/health" || (docker compose logs --tail=100 && exit 1)
            docker image prune -f
